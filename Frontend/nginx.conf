server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unmatched path serves index.html so client-side
    # routing (react-router) handles it instead of nginx 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
