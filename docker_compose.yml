version: "3.8"

services:

  backend:
    build: ./Backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/do_it_now
      - JWT_SECRET=change-me-in-production
      - PORT=5000
      - NODE_ENV=production
      - FRONTEND_ORIGIN=http://localhost:8080

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    ports:
      - "8080:80"
    depends_on:
      - backend

  mongodb:
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
